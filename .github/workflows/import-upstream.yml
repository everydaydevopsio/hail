name: Import upstream source snapshots

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-upstream.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hail-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'everydaydevopsio/hail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import immutable source snapshots without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e upstream ]]; then
            echo 'Source snapshots already exist; refusing to overwrite them.'
            exit 0
          fi
          mkdir -p upstream docs
          import_source() {
            local name="$1" expected_tree="$2"
            git clone --quiet --depth=1 "https://github.com/markcallen/${name}.git" "${RUNNER_TEMP}/${name}"
            local actual_tree commit
            actual_tree=$(git -C "${RUNNER_TEMP}/${name}" rev-parse 'HEAD^{tree}')
            commit=$(git -C "${RUNNER_TEMP}/${name}" rev-parse HEAD)
            if [[ "$actual_tree" != "$expected_tree" ]]; then
              echo "Upstream ${name} changed since review; import stopped."
              exit 1
            fi
            mkdir "upstream/${name}"
            git -C "${RUNNER_TEMP}/${name}" archive HEAD | tar -x -C "upstream/${name}"
            printf '| [%s](https://github.com/markcallen/%s/tree/%s) | `%s` | `%s` |\n' "$name" "$name" "$commit" "$commit" "$actual_tree" >> docs/UPSTREAM.md
          }
          cat > docs/UPSTREAM.md <<'EOF'
          # Upstream provenance

          These directories are complete, unmodified source snapshots, not a merge of the original commit graphs. Preserve them as reference material. The supported Hail implementation lives outside `upstream/`.

          | Source | Commit | Git tree |
          | --- | --- | --- |
          EOF
          import_source ses-email-client 51934f4fd3c7a278ef61e6e1ddd1c91dbdfbe393
          import_source ses-receiving-terraform 4788ed6ca0aa62f7f3169eb2cfe26978f5dc3d32
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream docs/UPSTREAM.md
          git commit -m 'chore: import SES receiver and email client source baselines'
          git push origin HEAD:main
