name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver increment for a new release
        required: true
        type: choice
        options: [patch, minor, major]
      retry_tag:
        description: Existing workflow-created v tag to retry after a failed publish (leave blank for a new release)
        required: false
        type: string
      bootstrap_first_release:
        description: Validate and create the first tag without publishing (for the first authenticated npm publication)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hail-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select release source
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          BOOTSTRAP_FIRST_RELEASE: ${{ inputs.bootstrap_first_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_FIRST_RELEASE" = 'true' ] && [ -n "$RETRY_TAG" ]; then
            echo "::error::First-release bootstrap cannot retry an existing tag"
            exit 1
          fi
          if [ -n "$RETRY_TAG" ]; then
            if [[ ! "$RETRY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Retry tag must be a stable v-prefixed semver tag"
              exit 1
            fi
            git rev-parse --verify "refs/tags/$RETRY_TAG^{commit}" >/dev/null
            git merge-base --is-ancestor "refs/tags/$RETRY_TAG" origin/main
            RELEASE_COMMIT=$(git log -1 --format='%an|%s' "refs/tags/$RETRY_TAG")
            if [ "$RELEASE_COMMIT" != "github-actions[bot]|chore: release $RETRY_TAG" ]; then
              echo "::error::Retry tag does not point to a workflow-created release commit"
              exit 1
            fi
            git checkout --detach "refs/tags/$RETRY_TAG"
          fi
      - name: Require OpenAI API key for a new release
        if: inputs.retry_tag == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::OPENAI_API_KEY is unavailable; grant the secret to everydaydevopsio/hail before releasing"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run prettier
      - run: npm run test:coverage
      - run: npm test
      - run: npm run test:python
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Validate Terraform without cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive terraform
          for directory in terraform/bootstrap terraform/modules/receiver terraform/examples/cloudflare terraform/examples/route53 terraform/examples/manual; do
            terraform -chdir="$directory" init -backend=false -lockfile=readonly
            terraform -chdir="$directory" validate
            terraform -chdir="$directory" test
          done
      - name: Select new version
        if: inputs.retry_tag == ''
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          npm version "$RELEASE_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate Castoff release notes
        if: inputs.retry_tag == ''
        id: notes
        uses: everydaydevopsio/castoff/castoff@v2
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          tag: ${{ steps.version.outputs.tag }}
      - name: Update changelog
        if: inputs.retry_tag == ''
        uses: everydaydevopsio/castoff/changelog@v2
        with:
          version: ${{ steps.version.outputs.version }}
          entry: ${{ steps.notes.outputs.changelog_entry }}
      - name: Create version commit and tag
        id: tag
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RETRY_TAG" ]; then
            TAG="$RETRY_TAG"
          else
            TAG="$NEW_TAG"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json CHANGELOG.md
            git commit -m "chore: release $TAG"
            git tag "$TAG"
            git push --atomic origin HEAD:main "$TAG"
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: inputs.bootstrap_first_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require npm trusted publishing support
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$NPM_VERSION"
      - name: Verify tag and manifests
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "v$VERSION" ] || [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::Tag, package.json, and package-lock.json versions differ"
            exit 1
          fi
      - name: Require Castoff notes for a new release
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RETRY_TAG" ] && [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::Castoff notes are missing for a new release"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:package
      - name: Publish to npmjs with provenance
        run: npm publish --access public --provenance --ignore-scripts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
